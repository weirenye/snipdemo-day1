name: Build and push image
on:
  push:
    branches: [main]
    # bundle is a gitlink, not a directory glob.
    paths: [bundle, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snip-image
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Verify source pins and unmodified release sources
        run: node scripts/verify-release.mjs
      - name: Restore and build frontend
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm run build -- --progress=false
      - name: Verify built frontend matches release
        run: node scripts/verify-release.mjs --public
      - name: Frontend component tests
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless --progress=false
      - name: Source and bundle integration
        run: |
          node scripts/smoke.mjs
          node scripts/smoke.mjs --bundle
      - name: Dependency release gate
        working-directory: frontend
        run: npm audit --audit-level=high
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          load: true
          push: false
          tags: snip-verified:local
          provenance: false
      - name: Image vulnerability gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: snip-verified:local
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Container smoke test
        env:
          SNIP_TEST_URL: http://127.0.0.1:3000
        run: |
          docker run --detach --name snip-smoke -p 127.0.0.1:3000:3000 snip-verified:local
          node scripts/smoke.mjs --bundle
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          if docker container inspect snip-smoke >/dev/null 2>&1; then
            docker logs snip-smoke
            docker rm -f snip-smoke
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact scanned and tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag snip-verified:local "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
